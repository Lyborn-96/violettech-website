<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VioletTech Leads</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#4A2299">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leads">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6D3FE0;--brand-dk:#4A2299;--brand-dkr:#331769;--brand-lt:#9C79F0;
  --pale:#EEE8FD;--paler:#F7F4FE;
  --gold:#C0871F;--gold-bg:#FBF3E1;
  --ok:#2E7D62;--ok-bg:#E7F4EF;
  --no:#B0433B;--no-bg:#FBECEB;
  --ink:#221A33;--mid:#6E6485;--line:#E7E1F4;--bg:#F5F2FB;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:'Archivo',sans-serif;letter-spacing:-.025em;line-height:1.1}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button,input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* lock */
#lock{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,var(--brand-dkr),var(--brand-dk));display:grid;place-items:center;padding:24px}
#lock .box{width:100%;max-width:330px;text-align:center}
#lock .logo{width:52px;height:52px;margin:0 auto 20px;border-radius:14px;background:linear-gradient(145deg,var(--brand),var(--brand-lt));display:grid;place-items:center;color:#fff;font-family:'Archivo';font-weight:800;font-size:24px}
#lock h1{color:#fff;font-size:23px;margin-bottom:8px}
#lock p{color:#BEB0E4;font-size:13.5px;margin-bottom:26px;line-height:1.5}
#pin{width:100%;text-align:center;letter-spacing:.5em;font-family:'IBM Plex Mono';font-size:22px;padding:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:12px}
#pin::placeholder{letter-spacing:.2em;font-size:14px;color:#8D7EB8}
#lock button{width:100%;margin-top:14px;padding:14px;background:var(--brand-lt);color:#1B1026;border:0;border-radius:12px;font-weight:600;cursor:pointer}
#lockMsg{color:#F0A9A2;font-size:13px;margin-top:12px;min-height:18px}
#lock .fine{color:#8D7EB8;font-size:11.5px;margin-top:24px;line-height:1.5}

/* shell */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,var(--brand-dkr),var(--brand));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px}
.top .r{display:flex;align-items:center;gap:12px}
.top h1{font-size:18px;font-weight:800}
.top h1 b{font-weight:500;opacity:.7}
.top .sub{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:2px;font-family:'IBM Plex Mono'}
.iconb{margin-left:auto;background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:11px;font-size:19px;cursor:pointer;line-height:1}
main{padding:16px 16px calc(96px + var(--safe-b))}
.view{display:none}.view.on{display:block}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 12px}
.stat .n{font-family:'IBM Plex Mono';font-size:25px;color:var(--ink);line-height:1;letter-spacing:-.03em}
.stat .l{font-size:10.5px;color:var(--mid);margin-top:6px;line-height:1.25}
.stat.hero{grid-column:span 3;background:linear-gradient(135deg,var(--brand-dk),var(--brand));border:0;color:#fff}
.stat.hero .n{color:#fff;font-size:38px}
.stat.hero .l{color:rgba(255,255,255,.78);font-size:12px}

.sec{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec .c{margin-left:auto;color:var(--brand-dk);background:var(--pale);padding:2px 8px;border-radius:10px}

/* cards */
.lead{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;position:relative;overflow:hidden}
.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.lead.warm::before{background:var(--ok)}
.lead.cold::before{background:#B0A8C4}
.lead.od::before{background:var(--no)}
.lead .n{font-size:15.5px;font-weight:600;line-height:1.25}
.lead .m{font-size:12.3px;color:var(--mid);margin-top:3px}
.lead .row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tagx{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--pale);color:var(--brand-dk)}
.tagx.w{background:var(--ok-bg);color:var(--ok)}
.tagx.c{background:#EFECF6;color:#6E6485}
.na{font-size:12px;color:var(--mid);margin-left:auto;text-align:right;white-space:nowrap}
.na b{display:block;color:var(--ink);font-family:'IBM Plex Mono';font-size:11.5px}
.na.od b{color:var(--no)}
.na.today b{color:var(--gold)}
.empty{text-align:center;padding:44px 20px;color:var(--mid);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-family:'Archivo';font-size:16px;margin-bottom:6px}

/* fab + nav */
.fab{position:fixed;right:18px;bottom:calc(78px + var(--safe-b));width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;border:0;font-size:27px;line-height:1;box-shadow:0 10px 24px -6px rgba(77,34,153,.55);cursor:pointer;z-index:60}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
.nav button{flex:1;background:none;border:0;padding:11px 4px 12px;cursor:pointer;color:var(--mid);font-size:10.5px;font-family:'IBM Plex Mono';letter-spacing:.06em;text-transform:uppercase}
.nav button .g{display:block;font-size:17px;margin-bottom:3px;font-family:'Instrument Sans'}
.nav button[aria-selected="true"]{color:var(--brand-dk);font-weight:600}

/* sheet */
.sheet{position:fixed;inset:0;z-index:100;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(27,16,38,.5)}
.sheet .pan{position:absolute;left:0;right:0;bottom:0;max-height:94vh;background:var(--bg);border-radius:20px 20px 0 0;overflow-y:auto;padding-bottom:calc(20px + var(--safe-b))}
.sheet .hd{position:sticky;top:0;background:var(--bg);padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:2}
.sheet .hd h2{font-size:17px}
.sheet .hd .x{margin-left:auto;background:var(--line);border:0;width:32px;height:32px;border-radius:9px;font-size:17px;cursor:pointer;color:var(--ink);line-height:1}
.sheet .bdy{padding:16px 18px}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid #D2C9E6;border-radius:10px;background:#fff;color:var(--ink)}
.f textarea{min-height:78px;resize:vertical}
.f .h{font-size:11px;color:var(--mid);margin-top:5px;line-height:1.4}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;border:0;border-radius:11px;font-weight:600;cursor:pointer;margin-top:6px}
.b1{background:var(--brand);color:#fff}
.b2{background:#fff;color:var(--ink);border:1px solid var(--line)}
.b3{background:var(--no-bg);color:var(--no);border:1px solid #EFC9C6}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.steps button{flex:none;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;color:var(--mid);white-space:nowrap}
.steps button[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.note{background:var(--pale);border-radius:10px;padding:12px;font-size:12.5px;color:var(--brand-dk);line-height:1.5;margin-bottom:14px}
.note b{display:block;margin-bottom:3px}
.warnb{background:var(--gold-bg);color:#79540F;border-radius:10px;padding:12px;font-size:12.5px;line-height:1.5;margin-bottom:14px}
.warnb b{display:block;margin-bottom:3px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mid);flex:none}
.kv b{text-align:right;font-weight:500}
.dgrp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:14px}
a.call{color:var(--brand-dk);text-decoration:none;font-weight:600}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <div class="logo">V</div>
    <h1>VioletTech Leads</h1>
    <p>Enter your PIN to open the tracker.</p>
    <input type="password" id="pin" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off">
    <button id="unlock">Unlock</button>
    <div id="lockMsg"></div>
    <div class="fine">This PIN is a screen lock, not encryption. Your real protection is that no lead data is ever uploaded — it stays on this device only.</div>
  </div>
</div>

<div class="top">
  <div class="r">
    <div>
      <h1>Violet<b>Leads</b></h1>
      <div class="sub" id="todayLbl"></div>
    </div>
    <button class="iconb" id="btnSettings" aria-label="Settings">⚙</button>
  </div>
</div>

<main>
  <div class="view on" id="v-today"></div>
  <div class="view" id="v-pipe"></div>
  <div class="view" id="v-all"></div>
</main>

<button class="fab" id="fab" aria-label="Add company">+</button>

<nav class="nav" role="tablist">
  <button role="tab" aria-selected="true" data-v="today"><span class="g">◎</span>Today</button>
  <button role="tab" aria-selected="false" data-v="pipe"><span class="g">▤</span>Pipeline</button>
  <button role="tab" aria-selected="false" data-v="all"><span class="g">☰</span>All</button>
</nav>

<div class="sheet" id="sheet">
  <div class="bd" data-close></div>
  <div class="pan">
    <div class="hd"><h2 id="shTitle">Company</h2><button class="x" data-close>✕</button></div>
    <div class="bdy" id="shBody"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var KEY="vt_leads_v1", PKEY="vt_leads_pin";
var STAGES=["Identified","Researched","Contacted","Replied","Audit booked","Audit done","Proposal sent","Won","Lost"];
var WARMTH=["Cold — no connection","Warm — a name in common","Referred — someone will introduce me","Existing contact"];

var data=[], view="today", editing=null;

/* ---------- storage ---------- */
function hasLS(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}}
var LS=hasLS();
function load(){
  if(!LS)return;
  try{var r=localStorage.getItem(KEY);data=r?JSON.parse(r):[]}catch(e){data=[]}
}
function save(){
  if(!LS)return;
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Could not save. Your browser storage may be full or blocked.")}
}

/* ---------- dates ---------- */
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var MS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(s){if(!s)return"—";var p=s.split("-");return +p[2]+" "+MS[+p[1]-1]}
function dleft(s){if(!s)return null;return Math.round((new Date(s+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/86400000)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- render ---------- */
function card(c){
  var d=dleft(c.next), cls="", nacls="", txt="No next action";
  if(c.warm&&c.warm.indexOf("Cold")!==0)cls="warm";
  if(c.warm&&c.warm.indexOf("Cold")===0)cls="cold";
  if(c.next){
    txt=fmt(c.next);
    if(d<0){nacls="od";cls="od";txt=Math.abs(d)+"d overdue"}
    else if(d===0){nacls="today";txt="Today"}
    else if(d<=3)txt="In "+d+"d";
  }else cls="od";
  var wt=c.warm?(c.warm.indexOf("Cold")===0?"c":"w"):"c";
  return '<div class="lead '+cls+'" data-id="'+c.id+'">'+
    '<div class="n">'+esc(c.name)+'</div>'+
    '<div class="m">'+esc(c.industry||"—")+(c.size?" · "+esc(c.size):"")+(c.person?" · "+esc(c.person):"")+'</div>'+
    '<div class="row"><span class="tagx">'+esc(c.stage)+'</span>'+
    (c.warm?'<span class="tagx '+wt+'">'+esc(c.warm.split("—")[0].trim())+'</span>':'')+
    '<span class="na '+nacls+'">'+(c.nextWhat?esc(c.nextWhat.slice(0,22)):"next action")+'<b>'+txt+'</b></span>'+
    '</div></div>';
}

function draw(){
  document.getElementById("todayLbl").textContent=new Date().toDateString().toUpperCase();
  var t=todayISO();

  // TODAY
  var od=data.filter(function(c){return !isDone(c)&&c.next&&dleft(c.next)<0}).sort(function(a,b){return a.next<b.next?-1:1});
  var due=data.filter(function(c){return !isDone(c)&&c.next&&dleft(c.next)===0});
  var soon=data.filter(function(c){var d=dleft(c.next);return !isDone(c)&&c.next&&d>0&&d<=7}).sort(function(a,b){return a.next<b.next?-1:1});
  var none=data.filter(function(c){return !isDone(c)&&!c.next});
  var booked=data.filter(function(c){return ["Audit booked","Audit done","Proposal sent","Won"].indexOf(c.stage)>=0}).length;
  var active=data.filter(function(c){return !isDone(c)}).length;

  var h='<div class="stats">'+
    '<div class="stat hero"><div class="n">'+booked+'</div><div class="l">Audits booked or beyond — the only number that matters right now</div></div>'+
    '<div class="stat"><div class="n">'+active+'</div><div class="l">Active leads</div></div>'+
    '<div class="stat"><div class="n" style="color:'+(od.length?"var(--no)":"var(--ink)")+'">'+od.length+'</div><div class="l">Overdue</div></div>'+
    '<div class="stat"><div class="n" style="color:'+(none.length?"var(--gold)":"var(--ink)")+'">'+none.length+'</div><div class="l">No next action</div></div>'+
    '</div>';

  if(!data.length){
    h+='<div class="empty"><b>Nothing here yet</b>Tap + and add the first company. Name, what manual process you think they run, and one next action with a date.</div>';
  }else{
    if(od.length){h+='<div class="sec">Overdue<span class="c">'+od.length+'</span></div>'+od.map(card).join("")}
    if(due.length){h+='<div class="sec">Due today<span class="c">'+due.length+'</span></div>'+due.map(card).join("")}
    if(none.length){h+='<div class="sec">No next action — fix these<span class="c">'+none.length+'</span></div>'+none.map(card).join("")}
    if(soon.length){h+='<div class="sec">Next seven days<span class="c">'+soon.length+'</span></div>'+soon.map(card).join("")}
    if(!od.length&&!due.length&&!none.length&&!soon.length)
      h+='<div class="empty"><b>Nothing due</b>Every active lead has a next action dated further out.</div>';
  }
  document.getElementById("v-today").innerHTML=h;

  // PIPELINE
  var p="";
  STAGES.forEach(function(s){
    var L=data.filter(function(c){return c.stage===s});
    if(!L.length)return;
    p+='<div class="sec">'+s+'<span class="c">'+L.length+'</span></div>'+L.map(card).join("");
  });
  document.getElementById("v-pipe").innerHTML=p||'<div class="empty"><b>Empty pipeline</b>Add a company to get started.</div>';

  // ALL
  var A=data.slice().sort(function(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1});
  document.getElementById("v-all").innerHTML=A.length?
    '<div class="sec">All companies<span class="c">'+A.length+'</span></div>'+A.map(card).join(""):
    '<div class="empty"><b>No companies yet</b>Tap + to add one.</div>';

  document.querySelectorAll(".lead").forEach(function(el){
    el.addEventListener("click",function(){detail(el.dataset.id)})});
}
function isDone(c){return c.stage==="Won"||c.stage==="Lost"}

/* ---------- sheet ---------- */
function openSheet(title,html){
  document.getElementById("shTitle").textContent=title;
  document.getElementById("shBody").innerHTML=html;
  document.getElementById("sheet").classList.add("on");
  document.querySelector(".sheet .pan").scrollTop=0;
}
function closeSheet(){document.getElementById("sheet").classList.remove("on");editing=null}
document.querySelectorAll("[data-close]").forEach(function(e){e.addEventListener("click",closeSheet)});

function form(c){
  c=c||{};
  var sel=function(list,val){return list.map(function(o){return '<option'+(o===val?" selected":"")+'>'+o+'</option>'}).join("")};
  return '<div class="f"><label>Company name</label><input id="f_name" value="'+esc(c.name)+'" placeholder="e.g. Sekhukhune Electrical"></div>'+
  '<div class="f2"><div class="f"><label>Industry</label><input id="f_ind" value="'+esc(c.industry)+'" placeholder="Security, cleaning…"></div>'+
  '<div class="f"><label>Roughly how many staff</label><input id="f_size" value="'+esc(c.size)+'" placeholder="e.g. 40"></div></div>'+
  '<div class="f"><label>What manual process do they run?</label><textarea id="f_pain" placeholder="Leave forms on WhatsApp, guard rosters on paper…">'+esc(c.pain)+'</textarea><div class="h">This is your opening line. If you cannot fill it in, you have not researched them yet.</div></div>'+
  '<div class="f2"><div class="f"><label>Contact person</label><input id="f_person" value="'+esc(c.person)+'" placeholder="Name"></div>'+
  '<div class="f"><label>Their role</label><input id="f_role" value="'+esc(c.role)+'" placeholder="Owner, Ops Manager…"></div></div>'+
  '<div class="f2"><div class="f"><label>Phone</label><input id="f_phone" type="tel" value="'+esc(c.phone)+'"></div>'+
  '<div class="f"><label>Email</label><input id="f_email" type="email" value="'+esc(c.email)+'"></div></div>'+
  '<div class="f"><label>How do you reach them?</label><select id="f_warm">'+sel(WARMTH,c.warm)+'</select><div class="h">Referred and warm leads convert. Cold outreach mostly does not.</div></div>'+
  '<div class="f"><label>Stage</label><select id="f_stage">'+sel(STAGES,c.stage||"Identified")+'</select></div>'+
  '<div class="f"><label>Next action</label><input id="f_what" value="'+esc(c.nextWhat)+'" placeholder="Phone Thabo, ask about leave admin"></div>'+
  '<div class="f"><label>Next action date</label><input id="f_next" type="date" value="'+esc(c.next)+'"><div class="h">A lead without a dated next action is a wish, not a lead.</div></div>'+
  '<div class="f"><label>Notes</label><textarea id="f_notes" placeholder="What was said, what they cared about…">'+esc(c.notes)+'</textarea></div>'+
  '<button class="btn b1" id="f_save">Save</button>'+
  (c.id?'<button class="btn b3" id="f_del" style="margin-top:10px">Delete this company</button>':'');
}

function add(){
  editing=null;
  openSheet("New company",form({next:todayISO()}));
  wire();
}
function edit(c){
  editing=c.id;
  openSheet("Edit "+c.name,form(c));
  wire();
}
function wire(){
  document.getElementById("f_save").addEventListener("click",function(){
    var g=function(i){var e=document.getElementById(i);return e?e.value.trim():""};
    var name=g("f_name");
    if(!name){alert("Give the company a name.");return}
    var rec={id:editing||uid(),name:name,industry:g("f_ind"),size:g("f_size"),pain:g("f_pain"),
      person:g("f_person"),role:g("f_role"),phone:g("f_phone"),email:g("f_email"),
      warm:g("f_warm"),stage:g("f_stage"),nextWhat:g("f_what"),next:g("f_next"),notes:g("f_notes"),
      added:editing?(data.filter(function(x){return x.id===editing})[0]||{}).added||todayISO():todayISO()};
    if(editing){data=data.map(function(x){return x.id===editing?rec:x})}else{data.push(rec)}
    save();draw();closeSheet();
  });
  var d=document.getElementById("f_del");
  if(d)d.addEventListener("click",function(){
    if(confirm("Delete this company and all its notes? This cannot be undone.")){
      data=data.filter(function(x){return x.id!==editing});save();draw();closeSheet();}
  });
}

function detail(id){
  var c=data.filter(function(x){return x.id===id})[0];if(!c)return;
  var d=dleft(c.next);
  var h='<div class="steps" id="stSteps">'+STAGES.map(function(s){
    return '<button data-s="'+s+'" aria-selected="'+(s===c.stage)+'">'+s+'</button>'}).join("")+'</div>';
  if(c.next&&d<0)h+='<div class="warnb"><b>'+Math.abs(d)+' days overdue</b>'+esc(c.nextWhat||"No action recorded")+'</div>';
  else if(!c.next)h+='<div class="warnb"><b>No next action</b>Set one now, or this lead goes quiet.</div>';
  else h+='<div class="note"><b>Next: '+fmt(c.next)+(d===0?" (today)":d>0?" (in "+d+" days)":"")+'</b>'+esc(c.nextWhat||"—")+'</div>';

  h+='<div class="dgrp">';
  if(c.pain)h+='<div class="kv"><span>Manual process</span><b>'+esc(c.pain)+'</b></div>';
  h+='<div class="kv"><span>Industry</span><b>'+esc(c.industry||"—")+'</b></div>'+
     '<div class="kv"><span>Size</span><b>'+esc(c.size||"—")+'</b></div>'+
     '<div class="kv"><span>Route in</span><b>'+esc(c.warm||"—")+'</b></div>'+
     '<div class="kv"><span>Added</span><b>'+fmt(c.added)+'</b></div></div>';

  if(c.person||c.phone||c.email){
    h+='<div class="dgrp"><div class="kv"><span>Contact</span><b>'+esc(c.person||"—")+(c.role?"<br>"+esc(c.role):"")+'</b></div>';
    if(c.phone)h+='<div class="kv"><span>Phone</span><b><a class="call" href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a></b></div>';
    if(c.email)h+='<div class="kv"><span>Email</span><b><a class="call" href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></b></div>';
    h+='</div>';
  }
  if(c.notes)h+='<div class="dgrp"><div class="kv" style="display:block"><span style="display:block;margin-bottom:6px">Notes</span><b style="text-align:left;display:block;font-weight:400;line-height:1.55">'+esc(c.notes).replace(/\n/g,"<br>")+'</b></div></div>';

  h+='<button class="btn b1" id="d_edit">Edit</button>';
  openSheet(c.name,h);

  document.querySelectorAll("#stSteps button").forEach(function(b){
    b.addEventListener("click",function(){
      c.stage=b.dataset.s;save();draw();detail(id);});});
  document.getElementById("d_edit").addEventListener("click",function(){edit(c)});
}

/* ---------- settings ---------- */
function settings(){
  var h='<div class="note"><b>Your data lives on this device only</b>Nothing is uploaded to the website or anywhere else. That keeps it private and POPIA-friendly — but it also means a cleared browser or a lost phone loses everything. Export a backup weekly.</div>';
  if(!LS)h='<div class="warnb"><b>Storage is not available</b>This browser is blocking local storage, most likely because the page is in a preview or private window. Open the app from your own site to save data.</div>'+h;
  h+='<button class="btn b1" id="s_exp">Export backup file</button>'+
     '<button class="btn b2" id="s_imp" style="margin-top:10px">Import a backup</button>'+
     '<input type="file" id="s_file" accept="application/json" style="display:none">'+
     '<div class="f" style="margin-top:24px"><label>Change PIN</label><input id="s_pin" type="password" inputmode="numeric" maxlength="8" placeholder="New PIN (leave blank to remove)"><div class="h">A screen lock only. Anyone with this device and the file can read the data — the PIN is not encryption.</div></div>'+
     '<button class="btn b2" id="s_setpin">Save PIN</button>'+
     '<div style="margin-top:28px"></div>'+
     '<button class="btn b3" id="s_wipe">Erase everything on this device</button>'+
     '<div style="font-size:11.5px;color:var(--mid);margin-top:20px;line-height:1.55">'+data.length+' companies stored. To install as an app: on Android open the browser menu and choose Install app; on iPhone tap Share, then Add to Home Screen.</div>';
  openSheet("Settings",h);

  document.getElementById("s_exp").addEventListener("click",function(){
    var blob=new Blob([JSON.stringify({exported:todayISO(),leads:data},null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="violettech-leads-"+todayISO()+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  });
  document.getElementById("s_imp").addEventListener("click",function(){document.getElementById("s_file").click()});
  document.getElementById("s_file").addEventListener("change",function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result);
        var incoming=j.leads||j;
        if(!Array.isArray(incoming))throw 0;
        if(!confirm("Import "+incoming.length+" companies? This replaces what is on this device."))return;
        data=incoming;save();draw();closeSheet();
      }catch(err){alert("That file could not be read as a leads backup.")}
    };
    r.readAsText(f);
  });
  document.getElementById("s_setpin").addEventListener("click",function(){
    var v=document.getElementById("s_pin").value.trim();
    if(LS){if(v)localStorage.setItem(PKEY,v);else localStorage.removeItem(PKEY)}
    alert(v?"PIN saved.":"PIN removed.");closeSheet();
  });
  document.getElementById("s_wipe").addEventListener("click",function(){
    if(!confirm("Erase all companies from this device? Export a backup first if you might want them."))return;
    if(!confirm("Really erase everything? This cannot be undone."))return;
    data=[];save();draw();closeSheet();
  });
}

/* ---------- nav ---------- */
document.querySelectorAll(".nav button").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".nav button").forEach(function(x){x.setAttribute("aria-selected","false")});
    document.querySelectorAll(".view").forEach(function(x){x.classList.remove("on")});
    b.setAttribute("aria-selected","true");
    document.getElementById("v-"+b.dataset.v).classList.add("on");
    window.scrollTo(0,0);
  });});
document.getElementById("fab").addEventListener("click",add);
document.getElementById("btnSettings").addEventListener("click",settings);

/* ---------- lock ---------- */
function boot(){load();draw();document.getElementById("lock").style.display="none"}
var stored=LS?localStorage.getItem(PKEY):null;
if(!stored){boot()}
else{
  document.getElementById("pin").focus();
  var tryPin=function(){
    if(document.getElementById("pin").value===stored)boot();
    else{document.getElementById("lockMsg").textContent="That PIN is not right.";document.getElementById("pin").value=""}
  };
  document.getElementById("unlock").addEventListener("click",tryPin);
  document.getElementById("pin").addEventListener("keydown",function(e){if(e.key==="Enter")tryPin()});
}

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
